name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      # one platform failing shouldn't cancel the other's answer
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: go vet ./...
      # Linux: the grammars against systemd-analyze and GNU date. macOS: the
      # fixed-answer tests (the tools aren't there to compare against).
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o build/crontinental ./cmd/crontinental
      # The suite is black-box: it runs the built binary through its CLI. On
      # macOS that includes real runs (test_runs.py); Linux runners have no
      # systemd user manager, so those skip there.
      - run: CRONTINENTAL_BIN=$PWD/build/crontinental python -m unittest discover -v tests
